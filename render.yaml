services:
  - type: web
    name: url-checker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker detect_url.backend.app:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false # Set this in the Render dashboard; never commit the key
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PYTHONPATH
        value: .:detect_url
